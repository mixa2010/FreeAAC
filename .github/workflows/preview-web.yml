name: Preview web build

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: freeaac
  WRANGLER_VERSION: 4.153.0

jobs:
  preview:
    name: Build and deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v6

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🌐 Build static web export
        run: npm run deploy:web

      - name: 📦 Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-web-pr${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 14

      - name: 🚀 Deploy preview to Cloudflare Pages
        id: deploy
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: >-
            pages deploy dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-message="PR #${{ github.event.pull_request.number }}"

      - name: 💬 Comment preview URL on the pull request
        uses: actions/github-script@v9
        # Fork PRs get a read-only token, so commenting may 403 there.
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- freeaac-preview -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const log = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const url = process.env.PREVIEW_URL || process.env.DEPLOYMENT_URL

            const body = url
              ? `${marker}\n### 🚀 Web preview\n\n**Preview:** [${url}](${url})`
                + `${process.env.DEPLOYMENT_URL ? `\n\nThis exact commit: ${process.env.DEPLOYMENT_URL}` : ''}`
                + `\n\n[Build log](${log}) · commit \`${process.env.HEAD_SHA.slice(0, 7)}\``
              : `${marker}\n### 🌐 Web build\n\nNo preview deployment (fork pull request, or the deploy step failed).`
                + ` Lint and build passed — see the [build log](${log}).`

            const existing = (await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })).find((comment) => comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  cleanup:
    name: Delete preview on close
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Delete this pull request's preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          wrangler="npx --yes wrangler@${WRANGLER_VERSION}"

          # delete takes a deployment id, so the list is the only way to find
          # them; force also frees the pr-<number> alias on the newest one.
          ids="$($wrangler pages deployment list \
            --project-name="${PAGES_PROJECT}" --environment=preview --json \
            | jq -r --arg branch "pr-${PR_NUMBER}" '.[] | select(.Branch == $branch) | .Id')"

          for id in $ids; do
            $wrangler pages deployment delete "$id" --project-name="${PAGES_PROJECT}" --force
          done
